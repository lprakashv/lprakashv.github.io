# This is a basic workflow to help you get started with Actions

name: lprakashv.com blog site github pages publish

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

  # Refresh the local profile and app list each night.
  schedule:
    - cron: "17 0 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  deploy:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3
        with:
          submodules: true # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0 # Fetch all history for .GitInfo and .Lastmod

      - name: Sync app list
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_apps.py

      - name: Check out profile repository
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v3
        with:
          repository: lprakashv/lprakashv
          path: .profile-source
          persist-credentials: false

      - name: Sync profile README
        if: github.event_name != 'pull_request'
        run: |
          test -s .profile-source/README.md
          cp .profile-source/README.md blog/content/about/profile-readme.md
          mkdir -p blog/static/about/images
          cp .profile-source/lprakashv-profile-banner.png blog/static/about/
          cp .profile-source/images/* blog/static/about/images/

          git add blog/content/about/profile-readme.md blog/static/about README.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync profile and app list"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "0.170.1"
          extended: true
      - name: Build
        working-directory: ./blog
        run: hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        # if: github.ref == 'refs/heads/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./blog/public
          cname: www.lprakashv.com
